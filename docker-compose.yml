services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 2s
      retries: 30

  php:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
